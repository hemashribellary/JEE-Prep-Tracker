{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Log Mistake</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Subject</label>
                <select name="subject" class="form-select" required>
                    <option value="">-- Select Subject --</option>
                    <option value="Physics">Physics</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Mathematics">Mathematics</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Topic</label>
                <input type="text" name="topic" class="form-control" placeholder="e.g. Organic Chemistry" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Question</label>
                <textarea name="question" class="form-control" rows="4" placeholder="Write the question you got wrong..." required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Mistake Type</label>
                <select name="mistake_type" class="form-select" required>
                    <option value="">-- Select Type --</option>
                    <option value="Conceptual">Conceptual</option>
                    <option value="Calculation">Calculation</option>
                    <option value="Silly">Silly</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Notes (optional)</label>
                <textarea name="notes" class="form-control" rows="3" placeholder="What went wrong and why..."></textarea>
            </div>
            <button type="submit" class="btn btn-danger">Save Mistake</button>
            <a href="{{ url_for('mistakes') }}" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
